<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Money Tools</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
    }

    .tool {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
    }

    .result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #777;
    }
  </style>
</head>

<body>

  <h1>Quick Money Tools</h1>

  <p style="text-align: center;">
    Simple free calculators for everyday money calculations.
  </p>

  <div class="tool">
    <h2>Percentage Calculator</h2>

    <input type="number" id="percent" placeholder="Percentage (%)">
    <input type="number" id="number" placeholder="Amount">

    <button onclick="calculatePercentage()">Calculate</button>

    <div class="result" id="percentageResult"></div>
  </div>

  <div class="tool">
    <h2>Discount Calculator</h2>

    <input type="number" id="price" placeholder="Original price">
    <input type="number" id="discount" placeholder="Discount (%)">

    <button onclick="calculateDiscount()">Calculate</button>

    <div class="result" id="discountResult"></div>
  </div>

  <footer>
    © 2026 Quick Money Tools
  </footer>

  <script>
    function calculatePercentage() {
      const percent = Number(document.getElementById("percent").value);
      const number = Number(document.getElementById("number").value);

      const result = (percent / 100) * number;

      document.getElementById("percentageResult").textContent =
        "Result: " + result;
    }

    function calculateDiscount() {
      const price = Number(document.getElementById("price").value);
      const discount = Number(document.getElementById("discount").value);

      const saved = (discount / 100) * price;
      const finalPrice = price - saved;

      document.getElementById("discountResult").textContent =
        "You save: " + saved + " | Final price: " + finalPrice;
    }
  </script>

</body>
</html>
